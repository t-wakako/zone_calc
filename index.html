<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zone System Calculator</title>
  <style>
      :root {
      --bg: #1a1a1a;
      --card: #2d2d2d;
      --txt: #e0e0e0;
      --accent: #4dadf7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background: var(--bg);
      color: var(--txt);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }

    .calculator {
      background: var(--card);
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 24px rgba(0,0,0,.3);
    }

    h1 {
      font-size: 1.2rem;
      text-align: center;
      margin: 0 0 20px;
      letter-spacing: .05em;
    }

    .section {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: .85rem;
      color: #aaa;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      background: #3d3d3d;
      border: 1px solid #555;
      color: var(--txt);
      font-size: 1rem;
      outline: none;
    }

    .tabs {
      display: flex;
      background: #3d3d3d;
      border-radius: 8px;
      padding: 2px;
      margin-bottom: 12px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 8px;
      font-size: .85rem;
      cursor: pointer;
      border-radius: 6px;
      border: 0;
      background: transparent;
      color: var(--txt);
    }

    .tab.active {
      background: var(--accent);
      color: #1a1a1a;
      font-weight: bold;
    }

    .ev-control {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #3d3d3d;
      border-radius: 12px;
      padding: 6px;
    }

    .btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 1.5rem;
      cursor: pointer;
      width: 44px;
      height: 44px;
    }

    .ev-val {
      font-size: 1.5rem;
      font-weight: bold;
      text-align: center;
    }

    .ev-label {
      font-size: .7rem;
      color: #aaa;
      text-align: center;
    }

    .zone-bar {
      display: flex;
      background: #222;
      border-radius: 12px;
      padding: 6px;
      gap: 4px;
      justify-content: space-between;
    }

    .zone-box {
      flex: 1;
      text-align: center;
      padding: 6px 2px;
      border-radius: 6px;
      font-size: .75rem;
      min-height: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .z2 {
      background: #222;
      color: #888;
    }

    .z3 {
      background: #3a3a3a;
      color: #ccc;
    }

    .z4 {
      background: #555;
      color: #fff;
    }

    .z5 {
      background: #777;
      color: #fff;
      border: 1px solid var(--accent);
    }

    .z6 {
      background: #999;
      color: #000;
    }

    .z7 {
      background: #bbb;
      color: #000;
    }

    .z8 {
      background: #ddd;
      color: #000;
    }

    .zone-name {
      font-weight: bold;
    }

    .zone-ev {
      font-family: monospace;
      font-size: .75rem;
    }

    .results-container {
      background: #222;
      border-radius: 12px;
      padding: 8px 16px;
      max-height: 280px;
      overflow-y: auto;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 8px;
      font-size: .95rem;
      color: #888;
      cursor: pointer;
      border-radius: 6px;
      margin: 2px 0;
      transition: background .15s,color .15s;
    }

    .stop-value {
      color: var(--accent);
      font-weight: bold;
    }

    .notes-section {
      margin-top: 16px;
    }

    .notes-section input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      background: #3d3d3d;
      border: 1px solid #555;
      color: var(--txt);
      font-size: 1rem;
      outline: none;
    }

    .notes-section input:focus {
      border-color: var(--accent);
    }

    .return-button {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      background: var(--accent);
      color: #1a1a1a;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .return-button[hidden] {
      display: none;
    }

    /* 選択行を中央へスクロールする際の余白 */
    .results-container {
      scroll-behavior: auto;
    }

    /* 選択された組み合わせ */
    .result-row.selected {
      background: var(--accent) !important;
      color: #1a1a1a !important;
      font-weight: bold;
    }

    /* 選択行内の絞り・シャッター速度 */
    .result-row.selected .stop-value {
      color: #1a1a1a !important;
    }

  </style>
</head>
<body>
  <main class="calculator">
    <div class="section">
      <div class="tabs" aria-label="メーターモード">
        <button class="tab active" id="tab1" type="button" onclick="setMode(1)">Classic Meter</button>
        <button class="tab" id="tab2" type="button" onclick="setMode(2)">Modern Meter</button>
      </div>

      <div id="iso-section">
        <label for="iso-select">実効感度を指定してください</label>
        <select id="iso-select" onchange="calculate()"></select>
      </div>

      <div id="compensation-section" hidden>
        <label for="compensation-select">露出補正(-4.0～3.0)</label>
        <select
          id="compensation-select"
          onchange="setCompensation(this.value)">
        </select>
      </div>

      <div class="notes-section">
        <input type="text" id="notes" maxlength="15" placeholder="フィルム番号など" autocomplete="off">
      </div>
    </div>
    <div class="section">
      <label>被写体のZONE V の測定値を指定してください</label>
      <label id="measured-ev" hidden></label>
      <div class="ev-control">
        <button class="btn" type="button" onclick="adjustEv(-1)" aria-label="EVを1/3段下げる">◀</button>
        <div>
          <div class="ev-val" id="ev-value">10.0</div>
          <div class="ev-label">ZONE V EV</div>
        </div>
        <button class="btn" type="button" onclick="adjustEv(1)" aria-label="EVを1/3段上げる">▶</button>
      </div>
    </div>
    <div class="section">
      <label>各ゾーンの対応EV値 (II ～ VIII)</label>
      <div class="zone-bar">
        <div class="zone-box z2"><span class="zone-name">II</span><span class="zone-ev" id="z2-val">-</span></div>
        <div class="zone-box z3"><span class="zone-name">III</span><span class="zone-ev" id="z3-val">-</span></div>
        <div class="zone-box z4"><span class="zone-name">IV</span><span class="zone-ev" id="z4-val">-</span></div>
        <div class="zone-box z5"><span class="zone-name">V</span><span class="zone-ev" id="z5-val">-</span></div>
        <div class="zone-box z6"><span class="zone-name">VI</span><span class="zone-ev" id="z6-val">-</span></div>
        <div class="zone-box z7"><span class="zone-name">VII</span><span class="zone-ev" id="z7-val">-</span></div>
        <div class="zone-box z8"><span class="zone-name">VIII</span><span class="zone-ev" id="z8-val">-</span></div>
      </div>
    </div>
    <div class="section">
      <label>ZONE V の露出組み合わせ</label>
      <div class="results-container" id="results"></div>
    </div>
    <button type="button" id="return-to-app" class="return-button" onclick="returnToApp()" hidden>◀ スポットメーターに戻る</button>
  </main>
  <script>
    'use strict';

    const isoList = [6.4,8,10,12,16,20,25,32,40,50,64,80,100,125,160,200,250,320,400,500,640,800,1000,1250,1600,2000,2500,3200,4000,5000,6400];
    const fNumberStrings = ["1.0","1.1","1.2","1.4","1.6","1.8","2.0","2.2","2.5","2.8","3.2","3.5","4.0","4.5","5.0","5.6","6.3","7.1","8.0","9.0","10","11","13","14","16","18","20","22","25","29","32","36","40","45","51","57","64","72","81","90","102","114","128"];
    const fNumberValues = [1.0,1.12,1.26,1.41,1.59,1.78,2.0,2.24,2.52,2.83,3.17,3.56,4.0,4.49,5.04,5.66,6.35,7.13,8.0,8.98,10.08,11.31,12.70,14.25,16.0,17.96,20.16,22.63,25.4,28.51,32.0,35.92,40.32,45.25,50.8,57.02,64.0,71.84,80.63,90.51,101.59,114.04,128.0];
    const shutterStrings = ["1/8000","1/6400","1/5000","1/4000","1/3200","1/2500","1/2000","1/1600","1/1250","1/1000","1/800","1/640","1/500","1/400","1/320","1/250","1/200","1/160","1/125","1/100","1/80","1/60","1/50","1/40","1/30","1/25","1/20","1/15","1/13","1/10","1/8","1/6","1/5","1/4","1/3","1/2.5","1/2","0.6s","0.8s","1s","1.3s","1.6s","2s","2.5s","3.2s","4s","5s","6s","8s","10s","13s","16s","20s","25s","30s","40s","50s","60s","80s","100s","120s"];
    const shutterValues = [1/8192,1/6502,1/5161,1/4096,1/3251,1/2580,1/2048,1/1625,1/1290,1/1024,1/813,1/645,1/512,1/406,1/323,1/256,1/203,1/161,1/128,1/102,1/81,1/64,1/51,1/40,1/32,1/25,1/20,1/16,1/12.7,1/10.1,1/8,1/6.3,1/5.0,1/4,1/3.2,1/2.5,1/2,0.63,0.79,1,1.26,1.59,2,2.52,3.17,4,5.04,6.35,8,10.08,12.70,16,20.16,25.40,32,40.32,50.80,64,80.63,101.59,128];
    const fullStopFNumbers = ["1.0","1.4","2.0","2.8","4.0","5.6","8.0","11","16","22","32","45","64","90","128"];
    const fullStopShutters = ["1/8000","1/4000","1/2000","1/1000","1/500","1/250","1/125","1/60","1/30","1/15","1/8","1/4","1/2","1s","2s","4s","8s","16s","30s","60s","120s"];

    // Store EV as integer thirds to avoid cumulative floating-point drift.
    let currentEvThirds = 30;
    let originalEv = null;  // アプリから渡された元のEV値
    let currentMode = 1;
    let selectedFStr = null;
    let selectedSStr = null;
    let appSession = false;
    let ready = false;
    let compensationThirds = 0;

    function validNumber(value) {
      if (value === null || value === undefined || typeof value === 'boolean') return null;
      if (typeof value === 'string' && value.trim() === '') return null;
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    }

    function validIso(value) {
      const n = validNumber(value);
      return n !== null && isoList.includes(n) ? n : null;
    }

    function validNotes(value) {
      const max = document.getElementById('notes').maxLength;
      return typeof value === 'string' && Array.from(value).length <= max ? value : null;
    }

    function validAperture(value) {
      if (value === null || value === undefined) return null;
      const str = String(value);
      // Allow exact listed labels only, not an approximate aperture.
      return fNumberStrings.includes(str) ? str : null;
    }

    function setMode(mode) {
      if (mode !== 1 && mode !== 2) return;

      currentMode = mode;

      document.getElementById('tab1').classList.toggle('active', mode === 1);
      document.getElementById('tab2').classList.toggle('active', mode === 2);

      document.getElementById('iso-section').hidden = mode !== 1;
      document.getElementById('compensation-section').hidden = mode !== 2;

      calculate();
    }

    function adjustEv(direction) {
      currentEvThirds = Math.max(0, Math.min(60, currentEvThirds + Math.sign(direction)));
      calculate();
    }

    function selectRow(fStr) {
      selectedFStr = selectedFStr === fStr ? null : fStr;
      calculate();
    }

    // ============================================================
      // EV・ゾーン・露出組み合わせの計算
    // ============================================================

      function calculate() {
      if (!ready) return;

      const ev = currentEvThirds / 3;
      document.getElementById('ev-value').textContent = ev.toFixed(1);

      // ZONE Vを基準として、各ゾーンのEVを表示する。
      for (let zone = 2; zone <= 8; zone++) {
        document.getElementById(`z${zone}-val`).textContent =
          (ev + zone - 5).toFixed(1);
      }

      const iso = Number(document.getElementById('iso-select').value);

      const compensation = compensationThirds / 3;

      const targetEv = currentMode === 1
        ? ev + Math.log2(iso / 100)
        : ev - compensation;

      // 前回のシャッタースピードをクリア
      selectedSStr = null;

      const container = document.getElementById('results');
      container.replaceChildren();

      // 各絞りに対し、最も近い定義済みシャッター速度を探す。
      for (let i = 0; i < fNumberStrings.length; i++) {
        const fStr = fNumberStrings[i];
        const fVal = fNumberValues[i];
        const requiredShutter = fVal ** 2 / 2 ** targetEv;

        let bestIndex = -1;
        let minimumDifference = Infinity;

        for (let s = 0; s < shutterValues.length; s++) {
          const difference = Math.abs(
            Math.log2(shutterValues[s] / requiredShutter)
          );

          if (difference < minimumDifference) {
            minimumDifference = difference;
            bestIndex = s;
          }
        }

        const isSelected = selectedFStr === fStr;
        const hasStandardShutter = bestIndex >= 0 && minimumDifference < 0.3;

        // 通常は誤差0.3段未満の行だけ表示する。
        // 選択中の絞りは範囲外でも必ず表示する。
        if (!isSelected && !hasStandardShutter) continue;

        const row = document.createElement('div');
        row.className = 'result-row';
        if (isSelected) row.classList.add('selected');
        row.onclick = () => selectRow(fStr);

        const fSpan = document.createElement('span');
        fSpan.textContent = `f/${fStr}`;
        if (fullStopFNumbers.includes(fStr)) {
          fSpan.classList.add('stop-value');
        }

        const shutterStr = hasStandardShutter
          ? shutterStrings[bestIndex]
          : formatCalculatedShutter(requiredShutter);

        // 選択中の絞りに対応するシャッタースピードを保存
        if (isSelected) {
          selectedSStr = hasStandardShutter
            ? shutterStrings[bestIndex]
            : null;
        }

        const sSpan = document.createElement('span');
        sSpan.textContent = shutterStr;
        if (fullStopShutters.includes(shutterStr)) {
          sSpan.classList.add('stop-value');
        }

        row.append(fSpan, sSpan);
        container.appendChild(row);
      }

      centerSelectedRow();
    }

    // 定義済みシャッター速度の範囲外では、計算値を表示する。
    function formatCalculatedShutter(seconds) {
      if (!Number.isFinite(seconds) || seconds <= 0) return '-';

      if (seconds < 1) {
        return `1/${Number((1 / seconds).toPrecision(3))}`;
      }

      return `${Number(seconds.toPrecision(3))}s`;
    }

    // 選択行がスクロール領域の中央に来るようにする。
    function centerSelectedRow() {
      const container = document.getElementById('results');
      const selectedRow = container.querySelector('.result-row.selected');
      if (!selectedRow) return;

      // offsetTopの基準要素に依存しないよう、矩形の差分を使う。
      const containerRect = container.getBoundingClientRect();
      const selectedRect = selectedRow.getBoundingClientRect();
      const rowTop = selectedRect.top - containerRect.top + container.scrollTop;
      const targetScroll = rowTop -
      (container.clientHeight - selectedRow.offsetHeight) / 2;
      const maxScroll = Math.max(0, container.scrollHeight - container.clientHeight);

      container.scrollTop = Math.max(0, Math.min(maxScroll, targetScroll));
    }

    // Public Swift -> HTML entry point. Partial or invalid fields are ignored.
    // Example: restoreValues({ev: 10.33, iso: 400, notes: 'Film001', f: '11'});
    function restoreValues(data) {
      if (!ready || !data || typeof data !== 'object' || Array.isArray(data)) return false;
      const ev = validNumber(data.ev);
      const iso = validIso(data.iso);
      const notes = validNotes(data.notes);
      const aperture = validAperture(data.f);
      let changed = false;

      if (ev !== null && ev >= 0 && ev <= 20) {
        // アプリから渡された元のEV値を保持
        originalEv = ev;

        // HTML上で操作するEV値
        currentEvThirds = Math.round(ev * 3);

        const measuredLabel = document.getElementById('measured-ev');
        measuredLabel.textContent = `測定値:EV${ev.toFixed(2)}`;
        measuredLabel.hidden = false;

        changed = true;
      }
      
      if (iso !== null) {
        document.getElementById('iso-select').value = String(iso);
        changed = true;
      }
      if (notes !== null) {
        document.getElementById('notes').value = notes;
        changed = true;
      }
      if (aperture !== null) {
        selectedFStr = aperture;
        changed = true;
      }
      if (changed) {
        // App-provided settings always use Modern Meter.
        setMode(2);
        appSession = true;
        document.getElementById('return-to-app').hidden = false;
      }
      return changed;
    }

    function currentSettings() {
      return {
        ev: currentEvThirds / 3,
        originalEv: originalEv,
        iso: Number(document.getElementById('iso-select').value),
        notes: document.getElementById('notes').value,
        f: selectedFStr,
        s: selectedSStr,
        comp: currentMode === 2 ? compensationThirds / 3 : 0
      };
    }

    function returnToApp() {
      if (!appSession) return;

      const data = currentSettings();
      const notes = validNotes(data.notes);

      if (
        validIso(data.iso) === null ||
      notes === null ||
      (data.f !== null && validAperture(data.f) === null)
      ) {
        alert('入力値を確認してください。');
        return;
      }

      // WKWebView の JavaScript Bridge
      const bridge = window.webkit?.messageHandlers?.returnData;

      if (bridge && typeof bridge.postMessage === 'function') {
        bridge.postMessage(data);
        return;
      }

      // Safari 等からのカスタムURLスキーム
      const url = new URL('spotmeter://return');

      url.searchParams.set('ev', String(data.ev));
      url.searchParams.set('iso', String(data.iso));
      url.searchParams.set('notes', data.notes);

      if (data.f !== null) {
        url.searchParams.set('f', data.f);
      }

      // シャッタースピードを追加
      if (data.s !== null) {
        url.searchParams.set('s', data.s);
      }

      url.searchParams.set('comp', String(data.comp));

      if (data.originalEv !== null) {
        url.searchParams.set('originalEv', String(data.originalEv));
      }

      window.location.href = url.toString();

    }

    function setCompensation(value) {
      const thirds = Number(value);

      if (!Number.isInteger(thirds) || thirds < -12 || thirds > 9) {
        return;
      }

      compensationThirds = thirds;
      calculate();
    }

    function initialize() {
      const select = document.getElementById('iso-select');
      isoList.forEach(iso => {
        const option = document.createElement('option');
        option.value = String(iso);
        option.textContent = `実効感度 ${iso}`;
        option.selected = iso === 100;
        select.appendChild(option);
      });

      const compensationSelect =
        document.getElementById('compensation-select');

      for (let thirds = -12; thirds <= 9; thirds++) {
        const option = document.createElement('option');

        option.value = String(thirds);

        const value = thirds / 3;

        option.textContent =
          `${value > 0 ? '+' : ''}${value.toFixed(1)}`;

        option.selected = thirds === 0;

        compensationSelect.appendChild(option);
      }

      ready = true;
      const params = new URLSearchParams(window.location.search);
      const values = {};
      for (const name of ['ev', 'iso', 'notes', 'f']) {
        if (params.has(name)) values[name] = params.get(name);
      }
      // A valid EV triggers the original app-launch behavior. Other supplied
      // valid settings can also restore an app session.
      if (!restoreValues(values)) calculate();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initialize, {once:true});
    } else {
      initialize();
    }

  </script>
</body>
</html>
